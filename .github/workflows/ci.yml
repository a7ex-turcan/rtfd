name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs these same checks before it builds anything.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    # Windows is the primary target; Linux keeps paths and line endings honest.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Check formatting
        if: runner.os == 'Linux'
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

  aot:
    # Releases are Native AOT binaries, and a guard that passes under the JIT can fail open
    # after trimming (rtfq ADR 0001). So the binary that would ship is built and run here too.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish Native AOT
        run: dotnet publish src/Rtfd -c Release -r win-x64 -p:PublishAot=true -o publish

      - name: The published binary runs and accepts the example config
        shell: pwsh
        run: |
          ./publish/rtfd.exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          ./publish/rtfd.exe validate --config examples/rtfd.yaml --config-only
          if ($LASTEXITCODE -ne 0) { throw "validate refused the example config" }

      - name: The published binary refuses what v0 doesn't support, and never echoes a token
        shell: pwsh
        run: |
          $home_ = Join-Path $env:RUNNER_TEMP rtfd-home
          New-Item -ItemType Directory -Force (Join-Path $home_ prompts) | Out-Null
          Copy-Item examples/prompts/review.md (Join-Path $home_ prompts)
          $env:RTFD_HOME = $home_

          # Hooks aren't built yet.
          $config = (Get-Content examples/rtfd.yaml -Raw) + "    hooks:`n      - name: build`n        command: dotnet build`n"
          Set-Content (Join-Path $home_ rtfd.yaml) $config -NoNewline
          $out = ./publish/rtfd.exe validate --config-only | Out-String
          if ($LASTEXITCODE -ne 1 -or $out -notmatch 'config\.hooks_unsupported') { throw "hooks were not refused:`n$out" }

          # A token where a variable name belongs is refused without being shown. Built at run
          # time, so no token-shaped literal sits in the repo.
          $token = 'ghp_' + ('a' * 36)
          $config = (Get-Content examples/rtfd.yaml -Raw) -replace 'token_env: GH_TOKEN', "token_env: $token"
          Set-Content (Join-Path $home_ rtfd.yaml) $config -NoNewline
          $out = ./publish/rtfd.exe validate --config-only 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1 -or $out -notmatch 'config\.token_env_holds_a_token') { throw "the token was not refused:`n$out" }
          if ($out.Contains($token)) { throw "validate echoed the token" }

          # The runner exits with the last native exit code, which is the refusal above.
          exit 0

      - name: The published binary takes an Azure DevOps repo with its token from the Azure CLI
        shell: pwsh
        run: |
          $home_ = Join-Path $env:RUNNER_TEMP rtfd-ado
          New-Item -ItemType Directory -Force (Join-Path $home_ prompts) | Out-Null
          Copy-Item examples/prompts/review.md (Join-Path $home_ prompts)
          $env:RTFD_HOME = $home_
          $repo = "  - name: web-app`n    provider: azure_devops`n    repo: contoso/Fabrikam Fiber/web-app`n    trust: trusted`n    agent: claude`n    prompt: prompts/review.md`n    authors: [ada@contoso.com]`n    verdicts: [comment, approve, request_changes]`n    auth: azure_cli`n    tenant: contoso.onmicrosoft.com`n"
          Set-Content (Join-Path $home_ rtfd.yaml) ((Get-Content examples/rtfd.yaml -Raw) + $repo) -NoNewline
          $out = ./publish/rtfd.exe validate --config-only | Out-String
          if ($LASTEXITCODE -ne 0) { throw "an Azure DevOps repo was refused:`n$out" }

          # The Azure CLI's token is for Azure DevOps only.
          Set-Content (Join-Path $home_ rtfd.yaml) ((Get-Content examples/rtfd.yaml -Raw) -replace 'token_env: GH_TOKEN', 'auth: azure_cli') -NoNewline
          $out = ./publish/rtfd.exe validate --config-only | Out-String
          if ($LASTEXITCODE -ne 1 -or $out -notmatch 'config\.auth_unsupported') { throw "auth: azure_cli on GitHub was not refused:`n$out" }
          exit 0

      - name: The published binary opens the state store
        shell: pwsh
        run: |
          # SQLite is a native library next to the binary; a trimmed or missing one shows here.
          $env:RTFD_HOME = Join-Path $env:RUNNER_TEMP rtfd-state
          New-Item -ItemType Directory -Force $env:RTFD_HOME | Out-Null
          $out = ./publish/rtfd.exe retry sandbox --pr 1 --config examples/rtfd.yaml | Out-String
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'nothing to clear') { throw "the state store didn't open:`n$out" }
          if (-not (Test-Path (Join-Path $env:RTFD_HOME state.db))) { throw "no state.db was created" }

      - name: The published binary serves, reports its status and keeps one instance
        shell: pwsh
        run: |
          # No token in the environment, so serve watches nothing and nothing reaches GitHub; the
          # point is the status file, the locks, the signals and the job object after trimming.
          $home_ = Join-Path $env:RUNNER_TEMP rtfd-serve
          New-Item -ItemType Directory -Force (Join-Path $home_ prompts) | Out-Null
          Copy-Item examples/prompts/review.md (Join-Path $home_ prompts)
          Copy-Item examples/rtfd.yaml (Join-Path $home_ rtfd.yaml)
          $env:RTFD_HOME = $home_
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue

          $serve = Start-Process ./publish/rtfd.exe -ArgumentList 'serve' -PassThru -NoNewWindow -RedirectStandardError (Join-Path $env:RUNNER_TEMP serve.err)
          $status = Join-Path $home_ status.json
          for ($i = 0; $i -lt 100 -and -not (Test-Path $status); $i++) { Start-Sleep -Milliseconds 200 }
          if (-not (Test-Path $status)) { throw "serve wrote no status.json:`n$(Get-Content (Join-Path $env:RUNNER_TEMP serve.err) -Raw)" }

          $out = ./publish/rtfd.exe status | Out-String
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'rtfd serve is running' -or $out -notmatch 'GH_TOKEN') { throw "status didn't see serve running:`n$out" }
          $out = ./publish/rtfd.exe serve 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1 -or $out -notmatch 'already running') { throw "a second serve wasn't refused:`n$out" }
          $out = ./publish/rtfd.exe pause sandbox | Out-String
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'paused') { throw "pause failed:`n$out" }
          $out = ./publish/rtfd.exe resume sandbox | Out-String
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'lifted the pause') { throw "resume failed:`n$out" }

          Stop-Process -Id $serve.Id -Force
          $serve.WaitForExit()
          $out = ./publish/rtfd.exe status | Out-String
          if ($LASTEXITCODE -ne 1 -or $out -notmatch "didn't stop cleanly") { throw "status didn't see serve gone:`n$out" }
          exit 0

      - name: rtfd-git refuses hostile arguments in the published binary
        shell: pwsh
        run: |
          # The same tests as under the JIT, but with RTFD_BINARY set they drive the published
          # `rtfd git-tools` over stdio, as Claude does (plan Phase 1 exit criteria).
          dotnet build tests/Rtfd.Tests -c Release
          $env:RTFD_BINARY = (Resolve-Path publish/rtfd.exe).Path
          ./tests/Rtfd.Tests/bin/Release/net10.0/Rtfd.Tests.exe -class Rtfd.Tests.GitToolsTests
          if ($LASTEXITCODE -ne 0) { throw "rtfd-git's argument checks failed in the AOT binary" }
